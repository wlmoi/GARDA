name: GARDA unified GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [TinyTapeout physical flow]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: garda-unified-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      physical_available: ${{ steps.site.outputs.physical_available }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Check the interactive dashboard
        run: |
          node --check dashboard/dist/app.js
          node --check dashboard/dist/scene.js
          node --check dashboard/dist/gate-model.js
          python dashboard/tests/validate_dashboard.py
          python dashboard/tests/test_build_pages.py
      - name: Build dashboard and source-matched physical viewer
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          PHYSICAL_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          args=()
          if [ -n "$PHYSICAL_RUN_ID" ]; then args+=(--run-id "$PHYSICAL_RUN_ID"); fi
          python dashboard/scripts/build_pages.py build --output _site --fetch-artifact "${args[@]}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete GARDA site
        id: deployment
        uses: actions/deploy-pages@v4

  verify_actual_layout:
    if: needs.build.outputs.physical_available == 'true'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Download the exact site that was deployed
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: deployed-site
      - name: Verify the published actual neural logic layout
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          tar -xf deployed-site/artifact.tar -C deployed-site
          python -m pip install -r requirements-layout.txt
          python scripts/verify_published_neural_logic.py "${PAGE_URL%/}/tinytapeout.oas" --expected deployed-site/tinytapeout.oas --report evidence/neural_logic_published.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neural-logic-published-verification
          path: evidence/neural_logic_published.json
