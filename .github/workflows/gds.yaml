name: TinyTapeout physical flow
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Build GDS
        timeout-minutes: 150
        uses: TinyTapeout/tt-gds-action@3412659307918422f3f0727917cf9b499aaca588
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: d66cf179e7bc4d296362ab7e2e3b344dc3c4f665
      - name: Verify complete neural logic in the actual submission
        run: |
          python -m pip install -r requirements-layout.txt
          python scripts/check_neural_logic_layout.py tt_submission/tt_um_wlmoi_igor_neural_logic.oas --metrics runs/wokwi/final/metrics.json --report evidence/neural_logic_physical.json
      - name: Preserve neural logic physical diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neural-logic-physical-diagnostics
          if-no-files-found: warn
          path: |
            evidence/neural_logic_physical.json
            src/config*.json
            src/user_config*.json
            runs/wokwi/**/*.log
            runs/wokwi/**/*.rpt
            runs/wokwi/**/*.json
            runs/wokwi/**/*.json.original
            runs/wokwi/**/netgen_powered_netlist.v
            runs/wokwi/**/feedback.txt
            runs/wokwi/**/feedback.xml
            runs/wokwi/**/cif_scale.txt
  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: TinyTapeout/tt-gds-action/precheck@3412659307918422f3f0727917cf9b499aaca588
  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: TinyTapeout/tt-gds-action/gl_test@3412659307918422f3f0727917cf9b499aaca588
  viewer:
    needs: [gds, precheck, gl_test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download actual Tiny Tapeout submission
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
      - name: Download actual layout render
        uses: actions/download-artifact@v7
        with:
          name: gds_render
          path: gds_render
      - name: Package physical viewer without overwriting the dashboard
        env:
          PHYSICAL_RUN_ID: ${{ github.run_id }}
          PHYSICAL_COMMIT: ${{ github.sha }}
        run: |
          python dashboard/scripts/build_pages.py package --submission tt_submission --render gds_render --output physical-viewer --run-id "$PHYSICAL_RUN_ID" --commit "$PHYSICAL_COMMIT"
      - name: Preserve validated physical viewer for unified Pages deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: igor-physical-viewer
          path: physical-viewer
          if-no-files-found: error
      - name: Explain the single publishing path
        run: |
          echo "Actual layout artifact is ready. IGOR unified GitHub Pages publishes the dashboard and matching physical viewer together." >> "$GITHUB_STEP_SUMMARY"
