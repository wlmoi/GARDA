name: RTL verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      software_ref:
        description: 'Published 40-character karolyangqian/igor_ws commit; falls back to IGOR_WORKSPACE_REF repository variable'
        required: false
        type: string
      archive_snapshot:
        description: 'Also validate historical release manifest and both archived board packages'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  src-policy-safety-host:
    name: Paired current software policy, hardware safety and host
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IGOR_SOFTWARE_REF: ${{ inputs.software_ref || vars.IGOR_WORKSPACE_REF }}
    defaults:
      run:
        working-directory: software/peruri-iseedesign
    steps:
      - name: Require an explicit reproducible software revision
        working-directory: .
        shell: bash
        run: |
          if [[ ! "$IGOR_SOFTWARE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::Publish the matching igor_ws source and set IGOR_WORKSPACE_REF, or supply software_ref with its immutable 40-character commit. Current source checks cannot be skipped.'
            exit 1
          fi
      - name: Checkout matching software workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: karolyangqian/igor_ws
          ref: ${{ env.IGOR_SOFTWARE_REF }}
          path: software
          persist-credentials: false
      - name: Checkout this hardware revision beside software src
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: software/peruri-iseedesign
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install simulator and host fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install numpy==2.2.6 pyserial==3.5
      - name: Verify source weights, integer policy and UART
        run: python verification/src_policy/run.py --check
      - name: Verify actual DE10-Nano board wrapper and full-speed UART
        run: python verification/run_board_wrapper.py
      - name: Verify safety controls, numeric edges, map, logger and malformed protocol
        run: python verification/run_safety_regression.py
      - name: Verify software transport failure forces STOP
        run: python verification/run_host_regression.py
      - name: Save paired source and hardware evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: garda-paired-current-${{ github.sha }}
          path: |
            software/peruri-iseedesign/verification/src_policy/artifacts/
            software/peruri-iseedesign/verification/src_policy/*.gtkw
            software/peruri-iseedesign/evidence/current_board_wrapper/
            software/peruri-iseedesign/evidence/current_safety/
            software/peruri-iseedesign/evidence/current_host/
          if-no-files-found: error
          retention-days: 30
  archive-snapshot:
    name: Historical release snapshot integrity, explicit manual check
    if: github.event_name == 'workflow_dispatch' && inputs.archive_snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify archived package paths, image hashes and release manifest
        run: python scripts/validate_repository.py
  cocotb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Icarus and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install -r requirements.txt
      - name: Check release hashing implementation
        run: |
          python scripts/test_release_integrity.py
      - name: Run all RTL suites
        run: python verification/run.py all
      - name: Check generic synthesized gate
        run: python verification/run.py tt_generic
      - name: Verify complete neural logic inference and synthesis
        run: |
          python -m pip install -r requirements-asic.txt
          python scripts/generate_neural_logic_rom.py --check
          python scripts/synth_neural_logic.py
          python scripts/verify_neural_logic.py --generic
          python verification/run.py tt_logic
          python -m pip install -r requirements-layout.txt
          python scripts/test_neural_logic_layout.py
      - name: Run motor serializer and controller RTL tests
        working-directory: robot/jetauto/FPGA_UART_TTL_MULTISPEED
        run: |
          iverilog -g2012 -s tb_multispeed -o /tmp/igor_motor_packets rtl/stm_packet_tx_multispeed.v tb/tb_multispeed.v
          vvp /tmp/igor_motor_packets
          iverilog -g2012 -s tb_multispeed_control -o /tmp/igor_motor_control rtl/stm_packet_tx_multispeed.v rtl/stm_uart_multispeed_top.v tb/tb_multispeed_control.v
          vvp /tmp/igor_motor_control
      - name: Check motor packet encoding without serial access
        run: |
          python robot/jetauto/verify_driver.py
          python robot/jetauto/test_rtl_packets_on_stm.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: garda-verification
          path: |
            evidence/cocotb_*.xml
            evidence/neural_logic_*.json
            evidence/neural_logic_synthesis.log
            test/neural_logic_pin_results.json
            test/neural_logic_pin_guard_results.json
            verification/build/neural_logic/*.log
            verification/*results.json
            verification/*coverage.json
            robot/jetauto/offline_verification.json
          if-no-files-found: error
